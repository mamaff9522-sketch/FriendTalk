name: Build FriendTalk APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract FriendTalk ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          echo "Using: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          ls -la project

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x project/gradlew

      - name: Build APK
        working-directory: project
        run: ./gradlew assembleDebug

      - name: Upload FriendTalk APK
        uses: actions/upload-artifact@v4
        with:
          name: FriendTalk-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
