name: Build APK

on:
  push:
    branches: [ srimongkol99 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download web libraries (Leaflet map, Firebase)
        run: |
          L=app/src/main/assets/www/lib
          mkdir -p $L/images
          curl -fsSL -o $L/leaflet.js  https://unpkg.com/leaflet@1.9.4/dist/leaflet.js
          curl -fsSL -o $L/leaflet.css https://unpkg.com/leaflet@1.9.4/dist/leaflet.css
          for f in marker-icon.png marker-icon-2x.png marker-shadow.png layers.png layers-2x.png; do
            curl -fsSL -o $L/images/$f https://unpkg.com/leaflet@1.9.4/dist/images/$f
          done
          for f in app auth firestore; do
            curl -fsSL -o $L/firebase-$f-compat.js https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js
          done
          ls -la $L

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: srimongkol99-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Permanent link to the newest app (kept as a fixed tag, never marked "latest"
      # so it does not touch this repository's other releases):
      # https://github.com/<owner>/<repo>/releases/download/srimongkol99-apk/srimongkol99.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk srimongkol99.apk
          gh release delete srimongkol99-apk --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create srimongkol99-apk srimongkol99.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ศรีมงคล 99 เวอร์ชัน 1.0.${{ github.run_number }}" \
            --notes "แอปขนส่ง ศรีมงคล 99 — $(git log -1 --pretty=%s)" \
            --latest=false
