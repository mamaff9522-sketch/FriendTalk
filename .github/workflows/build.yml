name: Build APK

on:
  push:
    branches: [ srimongkol99 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download web libraries (3D map, Firebase)
        run: |
          L=app/src/main/assets/www/lib
          mkdir -p $L
          curl -fsSL -o $L/maplibre-gl.js  https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js
          curl -fsSL -o $L/maplibre-gl.css https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css
          for f in app auth firestore; do
            curl -fsSL -o $L/firebase-$f-compat.js https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js
          done
          ls -la $L

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # Computer version (admin control centre) on GitHub Pages:
      # https://<owner>.github.io/<repo>/srimongkol99/
      - name: Publish web version
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: app/src/main/assets/www
          destination_dir: srimongkol99
          keep_files: true
          commit_message: "ศรีมงคล 99 web ${{ github.run_number }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: srimongkol99-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Permanent link to the newest app (kept as a fixed tag, never marked "latest"
      # so it does not touch this repository's other releases):
      # https://github.com/<owner>/<repo>/releases/download/srimongkol99-apk/srimongkol99.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk srimongkol99.apk
          N=${{ github.run_number }}
          jq -n --argjson code $((N+1)) --arg name "1.0.$N" --rawfile notes release-notes.txt \
            '{versionCode:$code, versionName:$name, notes:($notes|rtrimstr("\n"))}' > version.json
          cat version.json
          gh release delete srimongkol99-apk --repo "${{ github.repository }}" --cleanup-tag -y || true
          gh release create srimongkol99-apk srimongkol99.apk version.json \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ศรีมงคล 99 เวอร์ชัน 1.0.$N" \
            --notes-file release-notes.txt \
            --latest=false
